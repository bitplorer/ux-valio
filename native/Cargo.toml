[package]
name = "ux-valio-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false
description = "Optional PyO3 apply peer: compile once + apply Integer/Float bounds and String length. ux-valio[native]."
rust-version = "1.83"

[lib]
name = "ux_valio_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
