[[feature]]
id = "native-peer"
purpose = "Optional ux-valio[native] apply: the host decides and compiles a closed plan at bind, the PyO3 peer applies it; stdlib Python stays the default."
modules = ["ux_valio.validators._native"]
symbols = [
  "ux_valio.validators._native:bind_native_plan",
  "ux_valio.validators._native:apply_native_bounds",
  "ux_valio.validators._native:_FamilyDoor",
]
tests = [
  "tests/test_native_layout.py",
  "tests/test_native_integer.py",
  "tests/test_native_string.py",
  "tests/test_native_ip.py",
  "tests/test_host_peer_measure.py",
]
docs = ["docs/explanation/host-peer-plan.md", "docs/explanation/performance.md"]

[[feature]]
id = "typing-plugin"
purpose = "mypy plugin that types facade construction as Any, so `name: str = StringValidator()` type-checks."
modules = ["ux_valio.mypy_plugin"]
symbols = ["ux_valio.mypy_plugin:UxValioPlugin", "ux_valio.mypy_plugin:plugin"]
tests = ["tests/test_field_default_typing.py"]
docs = ["docs/how-to/typing.md"]
