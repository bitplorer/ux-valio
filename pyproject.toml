[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ux-valio"
version = "0.2.0"
description = "Dataclass field-default validation via descriptors. Greenfield reimplementation of valio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "bitplorer" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["validation", "dataclass", "descriptor"]

[project.urls]
Homepage = "https://github.com/bitplorer/ux-valio"
Documentation = "https://github.com/bitplorer/ux-valio/tree/main/docs"
Source = "https://github.com/bitplorer/ux-valio"

[project.optional-dependencies]
dev = ["pytest>=7", "phonenumbers>=9.0.0", "mypy>=1.8"]
phonenumbers = ["phonenumbers>=9.0.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9"]

[tool.hatch.build.targets.wheel]
packages = ["ux_valio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
plugins = ["ux_valio.mypy_plugin"]
packages = ["ux_valio"]
pretty = true
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ux_valio.mypy_plugin"
ignore_errors = true
