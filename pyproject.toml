[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ux-valio"
version = "0.2.0"
description = "Door A descriptor-on-dataclass validation. Greenfield reimplementation of valio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "bitplorer" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["validation", "dataclass", "descriptor"]

[project.optional-dependencies]
dev = ["pytest>=7", "phonenumbers>=9.0.0"]
phonenumbers = ["phonenumbers>=9.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["ux_valio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
